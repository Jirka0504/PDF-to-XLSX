name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole -n omnia-gui omnia_pdf_to_xlsx_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: omnia-gui
          path: dist/omnia-gui.exe
